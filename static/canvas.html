<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限画布</title>
<link rel="stylesheet" href="/static/css/style.css?v=10">
<link rel="stylesheet" href="/static/css/components.css?v=6">
<style>
/* ===== 图片裁剪模态 ===== */
.cropper-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;}
.cropper-container{width:92vw;max-width:1100px;height:88vh;max-height:760px;background:#1a1a1a;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.cropper-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#222;border-bottom:1px solid #333;flex-shrink:0;}
.cropper-title{font-size:14px;font-weight:600;color:#eee;}
.cropper-close{width:28px;height:28px;border:none;background:transparent;color:#999;font-size:20px;cursor:pointer;border-radius:6px;line-height:1;}
.cropper-close:hover{background:#333;color:#fff;}
.cropper-body{display:flex;flex:1;min-height:0;}
.cropper-preview{flex:1;position:relative;overflow:hidden;background:#0d0d0d;cursor:move;user-select:none;-webkit-user-select:none;}
.cropper-preview img{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;pointer-events:none;will-change:transform;}
.cropper-frame{position:absolute;border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move;}
.cropper-handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #333;border-radius:50%;box-sizing:border-box;z-index:2;}
.cropper-handle[data-dir="nw"]{left:-6px;top:-6px;cursor:nw-resize;}
.cropper-handle[data-dir="n"]{left:50%;top:-6px;transform:translateX(-50%);cursor:n-resize;}
.cropper-handle[data-dir="ne"]{right:-6px;top:-6px;cursor:ne-resize;}
.cropper-handle[data-dir="e"]{right:-6px;top:50%;transform:translateY(-50%);cursor:e-resize;}
.cropper-handle[data-dir="se"]{right:-6px;bottom:-6px;cursor:se-resize;}
.cropper-handle[data-dir="s"]{left:50%;bottom:-6px;transform:translateX(-50%);cursor:s-resize;}
.cropper-handle[data-dir="sw"]{left:-6px;bottom:-6px;cursor:sw-resize;}
.cropper-handle[data-dir="w"]{left:-6px;top:50%;transform:translateY(-50%);cursor:w-resize;}
.cropper-rotate-handle{position:absolute;left:50%;transform:translateX(-50%);cursor:grab;z-index:3;display:flex;flex-direction:column;align-items:center;}
.cropper-rotate-handle:active{cursor:grabbing;}
.cropper-rotate-line{width:1px;height:16px;background:rgba(255,255,255,.5);}
.cropper-rotate-dot{width:30px;height:30px;border-radius:50%;background:#4da6ff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.cropper-angle-display{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:4px;z-index:4;pointer-events:none;}
.cropper-size-display{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;z-index:4;pointer-events:none;white-space:nowrap;}
.cropper-panel{width:250px;flex-shrink:0;background:#242424;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.cropper-section{display:flex;flex-direction:column;gap:6px;}
.cropper-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;}
.cropper-ratio-btns{display:flex;flex-wrap:wrap;gap:4px;}
.cropper-ratio-btns button{padding:4px 8px;border:1px solid #444;background:#2a2a2a;color:#ccc;border-radius:4px;font-size:11px;cursor:pointer;}
.cropper-ratio-btns button:hover{border-color:#666;color:#fff;}
.cropper-ratio-btns button.active{background:#4da6ff;border-color:#4da6ff;color:#fff;}
.cropper-size-inputs{display:flex;align-items:center;gap:6px;}
.cropper-size-inputs input{flex:1;min-width:0;height:28px;padding:0 6px;border:1px solid #444;background:#1a1a1a;color:#eee;border-radius:4px;font-size:12px;outline:none;}
.cropper-size-inputs input:focus{border-color:#4da6ff;}
.cropper-size-inputs span{color:#888;font-size:12px;flex-shrink:0;}
.cropper-rotate-inputs{display:flex;align-items:center;gap:6px;}
.cropper-rotate-inputs input{flex:1;min-width:0;height:28px;padding:0 6px;border:1px solid #444;background:#1a1a1a;color:#eee;border-radius:4px;font-size:12px;outline:none;}
.cropper-rotate-inputs input:focus{border-color:#4da6ff;}
.cropper-rotate-btns{display:flex;gap:4px;}
.cropper-rotate-btns button{flex:1;height:26px;border:1px solid #444;background:#2a2a2a;color:#ccc;border-radius:4px;font-size:10px;cursor:pointer;}
.cropper-rotate-btns button:hover{border-color:#666;color:#fff;}
.cropper-zoom-row{display:flex;align-items:center;gap:6px;}
.cropper-zoom-row button{width:28px;height:28px;border:1px solid #444;background:#2a2a2a;color:#ccc;border-radius:4px;font-size:14px;cursor:pointer;flex-shrink:0;line-height:1;}
.cropper-zoom-row button:hover{border-color:#666;color:#fff;}
.cropper-zoom-row input[type=range]{flex:1;min-width:0;accent-color:#4da6ff;}
.cropper-zoom-row span{font-size:11px;color:#aaa;width:42px;text-align:right;flex-shrink:0;}
.cropper-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;}
.cropper-actions button{padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:none;font-weight:600;}
.cropper-btn-primary{background:#4da6ff;color:#fff;flex:1;min-width:100px;}
.cropper-btn-primary:hover{background:#3d96ef;}
.cropper-btn-secondary{background:#3a3a3a;color:#ccc;}
.cropper-btn-secondary:hover{background:#4a4a4a;color:#fff;}
.cropper-btn-cancel{background:transparent;color:#999;border:1px solid #444 !important;}
.cropper-btn-cancel:hover{color:#fff;border-color:#666 !important;}
.cropper-hint{font-size:10px;color:#666;line-height:1.5;}
@media (max-width:700px){
  .cropper-body{flex-direction:column;}
  .cropper-panel{width:auto;height:200px;flex-shrink:0;}
}
</style>
</head>
<body>
<div class="canvas-shell">
    <div class="canvas-toolbar" id="toolbar">
        <ui-tool-btn icon="image" label="toolbar.image" fallback="图片" action="createNode('image')"></ui-tool-btn>
        <ui-tool-btn icon="music" label="toolbar.audio" fallback="音频" action="createNode('audio')"></ui-tool-btn>
        <ui-tool-btn icon="prompt" label="toolbar.prompt" fallback="提示词" action="createNode('prompt')"></ui-tool-btn>
        <ui-tool-btn icon="lightning" label="toolbar.imageGen" fallback="生图" action="createNode('image_gen')"></ui-tool-btn>
        <ui-tool-btn icon="video" label="toolbar.videoGen" fallback="生视频" action="createNode('video_gen')"></ui-tool-btn>
        <ui-tool-btn icon="agent" label="toolbar.agent" fallback="Agent" action="createNode('agent')"></ui-tool-btn>
        <ui-tool-btn icon="list" label="toolbar.loop" fallback="列队" action="createNode('loop')"></ui-tool-btn>
        <ui-tool-btn icon="download" label="toolbar.output" fallback="输出" action="createNode('output')"></ui-tool-btn>
        <ui-tool-btn divider></ui-tool-btn>
        <ui-tool-btn icon="cube" label="toolbar.comfyui" fallback="ComfyUI" action="createNode('comfy')"></ui-tool-btn>
        <ui-tool-btn divider></ui-tool-btn>
        <ui-tool-btn icon="save" label="toolbar.save" fallback="保存" action="saveCanvas()"></ui-tool-btn>
        <ui-tool-btn divider></ui-tool-btn>
        <ui-tool-btn icon="folder" label="toolbar.assets" fallback="资产库" action="engine._toggleAssetPanel()"></ui-tool-btn>
        <div class="toolbar-status">
            <span data-t="toolbar.status">当前状态</span>
            <strong id="save-indicator" data-t="toolbar.waiting">等待编辑</strong>
        </div>
    </div>

    <div class="canvas-board" id="board" tabindex="0" style="outline:none;">
        <div class="world" id="world">
            <svg class="links" id="links"></svg>
            <div class="connection-handles" id="connection-handles"></div>
            <div id="groups-container"></div>
            <div id="nodes-container"></div>
        </div>
        <div class="selection-marquee" id="selection-marquee"></div>
    </div>

    <div class="create-menu" id="create-menu"></div>
    <div class="create-menu" id="connection-menu"></div>

    <!-- 快捷键面板 -->
    <div class="kbd-overlay" id="shortcutPanel" onclick="if(event.target===this)this.classList.remove('open')">
        <div class="kbd-panel">
            <h2 data-t="shortcuts.title">⌨ 快捷键</h2>
            <p class="kbd-subtitle" data-t="shortcuts.subtitle">按 <kbd>?</kbd> 随时打开此面板 · 按 <kbd>Esc</kbd> 关闭</p>
            <div class="kbd-grid" id="kbdGrid"></div>
            <button class="btn btn-secondary" style="margin-top:16px;width:100%;" onclick="document.getElementById('shortcutPanel').classList.remove('open')" data-t="shortcuts.close">关闭</button>
        </div>
    </div>

    <div class="minimap collapsed" id="minimap" title="小地图">
        <canvas id="minimap-canvas"></canvas>
        <div class="minimap-viewport" id="minimap-viewport"></div>
        <button class="minimap-toggle" onclick="var m=document.getElementById('minimap');m.classList.toggle('collapsed');this.textContent=m.classList.contains('collapsed')?'+':'−';event.stopPropagation();" title="折叠/展开">+</button>
    </div>

    <!-- 资产库面板 -->
    <div class="asset-panel" id="asset-panel">
        <div class="asset-panel-head">
            <span class="asset-panel-title" data-t="assets.title">资产库</span>
            <button class="asset-panel-close" onclick="document.getElementById('asset-panel').classList.remove('open')">&times;</button>
        </div>
        <div class="asset-tabs">
            <button class="asset-tab active" onclick="engine._loadAssets('input')"><span data-t="assets.input">输入</span></button>
            <button class="asset-tab" onclick="engine._loadAssets('output')"><span data-t="assets.output">输出</span></button>
        </div>
        <div class="asset-grid" id="asset-grid"></div>
        <div class="asset-hint" data-t="assets.hint">点击创建于视口中心 · 拖拽到画布上精准放置 · 拖到图片节点上替换</div>
    </div>

    <!-- 图片裁剪模态 -->
    <div class="cropper-overlay" id="cropper-overlay">
      <div class="cropper-container">
        <div class="cropper-header">
          <span class="cropper-title" data-t="cropper.title">图片裁剪</span>
          <button class="cropper-close" onclick="engine._closeCropper()">&times;</button>
        </div>
        <div class="cropper-body">
          <div class="cropper-preview" id="cropper-preview">
            <img id="cropper-image" alt="">
            <div class="cropper-frame" id="cropper-frame">
              <div class="cropper-handle" data-dir="nw"></div>
              <div class="cropper-handle" data-dir="n"></div>
              <div class="cropper-handle" data-dir="ne"></div>
              <div class="cropper-handle" data-dir="e"></div>
              <div class="cropper-handle" data-dir="se"></div>
              <div class="cropper-handle" data-dir="s"></div>
              <div class="cropper-handle" data-dir="sw"></div>
              <div class="cropper-handle" data-dir="w"></div>
            </div>
            <div class="cropper-rotate-handle" id="cropper-rotate-handle">
              <div class="cropper-rotate-line"></div>
              <div class="cropper-rotate-dot">⟳</div>
            </div>
            <div class="cropper-angle-display" id="cropper-angle-display">0.0°</div>
            <div class="cropper-size-display" id="cropper-size-display">800 × 600</div>
          </div>
          <div class="cropper-panel">
            <div class="cropper-section">
              <div class="cropper-label" data-t="cropper.aspectRatio">裁剪比例</div>
              <div class="cropper-ratio-btns" id="cropper-ratio-btns">
                <button data-ratio="free" class="active" data-t="cropper.ratioFree">自由</button>
                <button data-ratio="1">1:1</button>
                <button data-ratio="1.3333">4:3</button>
                <button data-ratio="0.75">3:4</button>
                <button data-ratio="1.7778">16:9</button>
                <button data-ratio="0.5625">9:16</button>
              </div>
            </div>
            <div class="cropper-section">
              <div class="cropper-label" data-t="cropper.outputSize">输出尺寸 (px)</div>
              <div class="cropper-size-inputs">
                <input type="number" id="cropper-output-w" min="1" step="1" value="800">
                <span>×</span>
                <input type="number" id="cropper-output-h" min="1" step="1" value="600">
              </div>
            </div>
            <div class="cropper-section">
              <div class="cropper-label" data-t="cropper.rotation">旋转角度</div>
              <div class="cropper-rotate-inputs">
                <input type="number" id="cropper-angle-input" step="0.1" value="0">
                <span>°</span>
              </div>
              <div class="cropper-rotate-btns">
                <button onclick="engine._cropperRotate(-90)" data-t="cropper.rotateLeft">↺ 左转90°</button>
                <button onclick="engine._cropperRotate(90)" data-t="cropper.rotateRight">↻ 右转90°</button>
              </div>
            </div>
            <div class="cropper-section">
              <div class="cropper-label" data-t="cropper.zoom">缩放</div>
              <div class="cropper-zoom-row">
                <button onclick="engine._cropperZoomBy(0.8)">−</button>
                <input type="range" id="cropper-zoom-slider" min="0.1" max="5" step="0.01" value="1">
                <button onclick="engine._cropperZoomBy(1.25)">+</button>
                <span id="cropper-zoom-value">100%</span>
              </div>
            </div>
            <div class="cropper-actions">
              <button class="cropper-btn-secondary" onclick="engine._cropperReset()" data-t="cropper.reset">重置</button>
              <button class="cropper-btn-cancel" onclick="engine._closeCropper()" data-t="cropper.cancel">取消</button>
              <button class="cropper-btn-primary" onclick="engine._applyCrop()" data-t="cropper.confirm">✓ 确认裁剪</button>
            </div>
            <div class="cropper-hint" data-t="cropper.hint">拖拽图片=平移 · 滚轮=缩放 · 拖拽顶部蓝点=旋转 · 拖拽白框=调整裁剪</div>
          </div>
        </div>
      </div>
    </div>
</div>

<script src="/static/js/ui-icon.js?v=2"></script>
<script src="/static/js/ui-tool-btn.js?v=3"></script>
<script src="/static/js/i18n.js?v=3"></script>
<script src="/static/js/api.js?v=14"></script>
<script src="/static/js/canvas-store.js?v=4"></script>
<script src="/static/js/canvas-core.js?v=32"></script>
<script src="/static/js/canvas-undo.js?v=3"></script>
<script src="/static/js/canvas-viewport.js?v=3"></script>
<!-- 渲染器模块（按依赖顺序加载） -->
<script src="/static/js/canvas-renderer-core.js?v=4"></script>
<script src="/static/js/canvas-renderer-providers.js?v=2"></script>
<script src="/static/js/canvas-renderer-nodes.js?v=32"></script>
<script src="/static/js/canvas-renderer-groups.js?v=5"></script>
<script src="/static/js/canvas-renderer-links.js?v=3"></script>
<script src="/static/js/canvas-renderer-lightbox.js?v=4"></script>
<script src="/static/js/canvas-renderer-assets.js?v=4"></script>
<script src="/static/js/canvas-pipeline.js?v=83"></script>
<script src="/static/js/canvas-events.js?v=3"></script>
<script>
const engine = new CanvasEngine('board', 'world', 'nodes-container', 'links');
engine.init().then(() => {
    console.log('canvas ready');
    // 页面关闭/切换前强制保存（绕过 debounce，防止节点位置丢失）
    window.addEventListener('beforeunload', () => {
        clearTimeout(engine._saveDebounceTimer);
        engine.save();
    });
}).catch(err => {
    console.error('画布初始化失败:', err);
    // 显示错误提示而非空白页面
    const board = document.getElementById('board');
    if (!board) return;
    const msg = err && (err.message || String(err));
    const safeMsg = String(msg || '未知错误').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--bad);border-radius:12px;padding:24px;text-align:center;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:420px;';
    overlay.innerHTML = '<div style="font-size:16px;font-weight:700;color:var(--bad);margin-bottom:8px;">画布加载失败</div>' +
        '<div style="font-size:12px;color:var(--muted);margin-bottom:16px;word-break:break-all;">' + safeMsg + '</div>' +
        '<div style="display:flex;gap:8px;justify-content:center;">' +
        '<button onclick="localStorage.removeItem(\'canvas_current_id\');location.reload()" style="padding:6px 16px;border:1px solid var(--bad);border-radius:8px;background:var(--bg);color:var(--bad);cursor:pointer;font-size:13px;">' + (typeof _t !== 'undefined' ? _t('canvas.resetAndReload','重置画布 ID 并刷新') : '重置画布 ID 并刷新') + '</button>' +
        '<button onclick="location.reload()" style="padding:6px 16px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:13px;">' + (typeof _t !== 'undefined' ? _t('canvas.reload','直接刷新') : '直接刷新') + '</button>' +
        '</div>';
    board.appendChild(overlay);
});

// 初始化主题（postMessage 可能在新页面加载前已发送）
(function(){ if(localStorage.theme==='dark') document.documentElement.classList.add('dark'); })();

window.addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'theme') {
        document.documentElement.classList.toggle('dark', e.data.theme === 'dark');
    }
    if (e.data?.type === 'refresh') {
        // 平台变更 → 刷新 provider 缓存
        if (typeof refreshProviders === 'function') {
            refreshProviders().then(() => {
                if (typeof engine !== 'undefined') {
                    // 用户正在输入框中打字时跳过全量重渲染（避免 textarea 被销毁导致光标丢失）
                    var activeTag = String((document.activeElement || {}).tagName || '').toLowerCase();
                    if (activeTag !== 'input' && activeTag !== 'textarea') {
                        engine._renderAll();  // 节点 Provider/Model 下拉框
                    }
                    engine._loadAgentOpts().catch(() => {});    // Agent 节点下拉框
                    if (typeof engine.refreshComfyWorkflows === 'function') {
                        engine.refreshComfyWorkflows().catch(() => {});  // ComfyUI 节点工作流下拉框
                    }
                }
            }).catch(() => {});
        }
        // 检查是否切换了画布（canvas-gate 可能在 localStorage 写了新 canvas_id）
        const newId = localStorage.getItem('canvas_current_id');
        if (newId && typeof engine !== 'undefined' && engine.canvasId && newId !== engine.canvasId) {
            // 切换前保存当前画布（绕过 debounce，防止节点新位置丢失）
            clearTimeout(engine._saveDebounceTimer);
            engine.save().finally(() => {
                engine.canvasId = newId;
                engine.load().catch(err => console.error('切换画布失败:', err));
            });
        }
    }
    if (e.data?.type === 'agents-changed') {
        // Agent 变更 → 刷新 agent 列表 + 重渲染 Agent 节点下拉框
        if (typeof engine !== 'undefined') {
            engine._loadAgentOpts().then(() => { engine._renderAll(); }).catch(() => {});
        }
    }
    if (e.data?.type === 'lang' && e.data.lang) {
        document.documentElement.lang = e.data.lang;
    }
});

// 语言切换后重新渲染画布节点（更新动态生成的中文文本）
window.addEventListener('lang-applied', () => {
    if (typeof engine !== 'undefined' && engine._renderAll) {
        engine._renderAll();
    }
    buildShortcutGrid();
});

// 动态生成快捷键面板（中英文切换）
function buildShortcutGrid() {
    var grid = document.getElementById('kbdGrid');
    if (!grid) return;
    var rows = [
        {label: _t('shortcuts.pan1','平移画布'), keys: _t('shortcuts.pan1keys','Space+拖拽')},
        {label: _t('shortcuts.pan2','平移画布'), keys: _t('shortcuts.pan2keys','中键拖拽')},
        {label: _t('shortcuts.zoom','缩放画布'), keys: _t('shortcuts.zoomKeys','滚轮')},
        {label: _t('shortcuts.select','框选节点'), keys: _t('shortcuts.selectKeys','Ctrl+拖拽')},
        {label: _t('shortcuts.addRemove','加选/减选'), keys: _t('shortcuts.addRemoveKeys','Shift+点击')},
        {label: _t('shortcuts.group','打组'), keys: _t('shortcuts.groupKeys','Ctrl+G')},
        {label: _t('shortcuts.ungroup','解组'), keys: _t('shortcuts.ungroupKeys','Ctrl+Shift+G')},
        {label: _t('shortcuts.undo','撤销'), keys: _t('shortcuts.undoKeys','Ctrl+Z')},
        {label: _t('shortcuts.copyPaste','复制/粘贴'), keys: _t('shortcuts.copyPasteKeys','Ctrl+C/V')},
        {label: _t('shortcuts.deleteSel','删除选中'), keys: _t('shortcuts.deleteSelKeys','Delete')},
        {label: _t('shortcuts.createNode','创建节点'), keys: _t('shortcuts.createNodeKeys','右键空白')},
        {label: _t('shortcuts.nodeMenu','节点菜单'), keys: _t('shortcuts.nodeMenuKeys','右键选中')}
    ];
    grid.innerHTML = rows.map(function(r) {
        return '<div class="kbd-row"><span class="kbd-label">' + r.label + '</span><span class="kbd-keys">' + r.keys + '</span></div>';
    }).join('');
}
// 初始生成
if (typeof _t === 'function') { buildShortcutGrid(); } else { window.addEventListener('DOMContentLoaded', function(){ setTimeout(buildShortcutGrid, 100); }); }


function createNode(type) { engine.createNode(type); }
function saveCanvas() { engine.save(); }
</script>
</body>
</html>
